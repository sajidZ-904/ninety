services:
  postgres:
    image: postgres:17-alpine
    container_name: ninety-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ninety_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ninety_db"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ninety-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ninety_db
      APP_NOW: "2026-11-11T15:00:00Z"
      COMPANY_TIMEZONE: "America/Chicago"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic -c backend/alembic.ini upgrade head &&
             python -m backend.app.seeder &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: ninety-frontend
    restart: always
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:

